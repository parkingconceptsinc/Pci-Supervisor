<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0E1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supervisor Dashboard">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>SUPERVISOR DASHBOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0A0E1A;
  --bg-1:#0F1526;
  --bg-2:#131B33;
  --surface:rgba(255,255,255,0.06);
  --surface-hi:rgba(255,255,255,0.11);
  --border:rgba(255,255,255,0.14);
  --border-hi:rgba(255,255,255,0.26);
  --blur-glass:22px;
  --text-hi:#F1F5F9;
  --text-mid:#94A3B8;
  --text-lo:#5B6B8C;
  --blue:#3B82F6;
  --blue-deep:#1D4ED8;
  --blue-glow:rgba(59,130,246,0.35);
  --green:#10B981;
  --green-deep:#047857;
  --green-glow:rgba(16,185,129,0.32);
  --radius-lg:20px;
  --radius-md:16px;
  --radius-sm:12px;
  --arrow-bg:rgba(148,163,184,0.08);
  --toast-bg:rgba(15,21,38,0.95);
  --glow-1:rgba(59,130,246,0.16);
  --glow-2:rgba(16,185,129,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  color:var(--text-hi);
  background:
    radial-gradient(circle at 15% -10%, var(--glow-1) 0%, transparent 45%),
    radial-gradient(circle at 100% 0%, var(--glow-2) 0%, transparent 40%),
    linear-gradient(180deg, rgba(15,42,110,0.60) 0%, rgba(9,16,38,0.75) 100%),
    url('./assets/bg.jpg') center/cover no-repeat fixed;
  background-attachment:fixed;
  transition:background-color 0.35s ease;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 36px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 56px) calc(env(safe-area-inset-left,0px) + 16px);
}

.main-container{
  width:100%;
  max-width:480px;
}

/* Header */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:13px 18px;
  border-radius:var(--radius-md);
  background:var(--surface);
  backdrop-filter:blur(var(--blur-glass));
  -webkit-backdrop-filter:blur(var(--blur-glass));
  border:1px solid var(--border);
  box-shadow:0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
  margin-bottom:20px;
  animation:slideIn 0.4s cubic-bezier(.34,1.2,.4,1) both;
}
.brand-mark{
  display:flex;align-items:center;justify-content:flex-start;
  min-width:0;
}
.brand-mark svg{width:36px;height:36px}
.brand-mark img{height:auto;width:180px;max-width:100%;object-fit:contain;border-radius:8px}

.header-info{
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  flex-shrink:0;
  min-width:0;
}
.hdr-clock{
  font-family:'Space Grotesk',sans-serif;
  font-size:28px;font-weight:700;letter-spacing:0.02em;color:var(--text-hi);
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.hdr-clock-ampm{font-size:0.45em;font-weight:600;margin-left:3px;letter-spacing:0.03em;color:var(--text-mid);}
@media (max-width:360px){
  .brand-mark img{width:130px}
  .hdr-clock{font-size:22px}
}
.hdr-meta{
  display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;color:var(--text-mid);
  letter-spacing:0.01em;
}
.hdr-weather{display:flex;align-items:center;gap:4px}
.hdr-weather-icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:#FBBF24;transition:color 0.3s ease}
.hdr-divider{opacity:0.35;font-size:10px}
.hdr-status{display:flex;align-items:center;gap:5px}
.hdr-status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);transition:background 0.3s ease,box-shadow 0.3s ease;flex-shrink:0}
.hdr-status-dot.offline{background:#EF4444;box-shadow:0 0 8px #EF4444}

/* Tabs */
.tabs{
  position:relative;
  display:flex;
  background:var(--surface);
  backdrop-filter:blur(var(--blur-glass));
  -webkit-backdrop-filter:blur(var(--blur-glass));
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:4px;
  margin-bottom:20px;
  gap:4px;
}
.tab-indicator{
  position:absolute;
  top:4px;bottom:4px;left:4px;
  width:calc(50% - 4px);
  border-radius:calc(var(--radius-md) - 4px);
  background:var(--surface-hi);
  backdrop-filter:blur(var(--blur-glass));
  -webkit-backdrop-filter:blur(var(--blur-glass));
  border:1px solid var(--border-hi);
  box-shadow:0 4px 14px rgba(0,0,0,0.3);
  transition:transform 0.32s cubic-bezier(.34,1.2,.4,1);
  z-index:0;
}
.tab-indicator.pos-data{transform:translateX(100%)}
.tab-btn{
  position:relative;z-index:1;
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 8px;
  border:none;border-radius:calc(var(--radius-md) - 4px);
  background:transparent;
  font-family:'Space Grotesk',sans-serif;
  font-size:12.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
  color:var(--text-lo);
  cursor:pointer;
  transition:color 0.3s ease;
  -webkit-tap-highlight-color:transparent;
}
.tab-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:0.9}
.tab-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tab-btn.is-active{color:var(--text-hi)}
.tab-btn.is-active.tone-reports{color:#93C5FD}
.tab-btn.is-active.tone-data{color:#6EE7B7}

.panel{display:none}
.panel.active{display:block}

.btn-list{display:flex;flex-direction:column;gap:10px}

.neu-btn{
  display:flex;align-items:center;gap:0;
  text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
  border-radius:var(--radius-md);position:relative;overflow:hidden;
  padding:13px 14px;
  background:var(--surface);
  backdrop-filter:blur(var(--blur-glass));
  -webkit-backdrop-filter:blur(var(--blur-glass));
  border:1px solid var(--border);
  box-shadow:0 1px 0 rgba(255,255,255,0.05) inset;
  transition:background 0.28s ease, border-color 0.28s ease,
             box-shadow 0.28s ease, transform 0.22s cubic-bezier(.34,1.4,.5,1);
  animation:slideIn 0.4s cubic-bezier(.34,1.2,.4,1) both;
}
.neu-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel .neu-btn:nth-child(1){animation-delay:0.02s}
.panel .neu-btn:nth-child(2){animation-delay:0.06s}
.panel .neu-btn:nth-child(3){animation-delay:0.10s}
.panel .neu-btn:nth-child(4){animation-delay:0.14s}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.neu-btn:hover,.neu-btn:focus-visible{
  background:var(--surface-hi);
  transform:translateY(-1px);
}
.panel-reports .neu-btn:hover{
  border-color:rgba(59,130,246,0.4);
  box-shadow:0 10px 24px rgba(4,10,24,0.45), 0 0 0 1px rgba(59,130,246,0.12) inset;
}
.panel-data .neu-btn:hover{
  border-color:rgba(16,185,129,0.4);
  box-shadow:0 10px 24px rgba(4,10,24,0.45), 0 0 0 1px rgba(16,185,129,0.12) inset;
}
.neu-btn:active{transform:scale(0.985) translateY(0)}

.neu-icon{
  width:42px;height:42px;flex-shrink:0;border-radius:12px;
  display:flex;align-items:center;justify-content:center;margin-right:13px;
  transition:transform 0.32s cubic-bezier(.34,1.4,.5,1), box-shadow 0.32s ease;
}
.panel-reports .neu-icon{
  background:linear-gradient(155deg,#2563EB,var(--blue-deep));
  box-shadow:0 4px 12px rgba(29,78,216,0.35), inset 0 1px 0 rgba(255,255,255,0.16);
}
.panel-data .neu-icon{
  background:linear-gradient(155deg,#059669,var(--green-deep));
  box-shadow:0 4px 12px rgba(4,120,87,0.35), inset 0 1px 0 rgba(255,255,255,0.16);
}
.neu-btn:hover .neu-icon{transform:scale(1.06)}
.panel-reports .neu-btn:hover .neu-icon{box-shadow:0 4px 16px rgba(59,130,246,0.5), inset 0 1px 0 rgba(255,255,255,0.2)}
.panel-data .neu-btn:hover .neu-icon{box-shadow:0 4px 16px rgba(16,185,129,0.5), inset 0 1px 0 rgba(255,255,255,0.2)}
.neu-icon svg{width:21px;height:21px;stroke:white;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.neu-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.neu-label{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:700;letter-spacing:0.01em;color:var(--text-hi)}
.neu-sub{font-size:11px;font-weight:500;color:var(--text-mid);letter-spacing:0.01em}

.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rippleAnim 0.6s linear;pointer-events:none;z-index:5}
.panel-reports .ripple{background:rgba(59,130,246,0.18)}
.panel-data .ripple{background:rgba(16,185,129,0.18)}
@keyframes rippleAnim{to{transform:scale(9);opacity:0}}


.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--toast-bg);backdrop-filter:blur(10px);
  color:#F1F5F9;padding:10px 22px;border-radius:99px;
  font-size:12.5px;font-weight:500;letter-spacing:0.02em;
  z-index:9999;border:1px solid var(--border-hi);
  transition:transform 0.3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.toast.show{transform:translateX(-50%) translateY(0)}

.visually-hidden{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

@media (prefers-reduced-motion: reduce){
  .neu-btn,.neu-icon,.toast,.tab-indicator{animation:none!important;transition:none!important}
}

/* In-app view: keeps every linked app inside this PWA's window (iframe) */
.app-view{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;
  background:#0A0E1A;
  opacity:0;pointer-events:none;transform:translateY(12px);
  transition:opacity 0.18s ease, transform 0.18s ease;
}
.app-view.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.app-view-bar{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:var(--surface);border-bottom:1px solid var(--border);
  backdrop-filter:blur(var(--blur-glass));
}
.app-view-back{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
  background:var(--surface-hi);border:1px solid var(--border-hi);
  color:var(--text-hi);border-radius:var(--radius-sm);
  padding:8px 12px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.app-view-back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(180deg)}
.app-view-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--text-hi)}
.app-view-frame-wrap{flex:1;position:relative}
.app-view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.app-view-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  gap:10px;color:var(--text-mid);font-family:'Space Grotesk',sans-serif;font-size:13px;
  background:#0A0E1A;transition:opacity 0.2s ease;
}
.app-view-loading.hide{opacity:0;pointer-events:none}
.app-view-spinner{
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--border-hi);border-top-color:var(--blue);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.app-view-error{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:24px;text-align:center;color:var(--text-mid);
  font-family:'Inter',sans-serif;font-size:13px;background:#0A0E1A;
}
.app-view-error.show{display:flex}
.app-view-error a{color:var(--blue);font-weight:700;text-decoration:none}
</style>
</head>
<body>

<div class="main-container">

  <div class="header">
    <div class="brand-mark">
      <img src="./assets/logo.png" alt="PCI Logo" width="180" height="90">
    </div>

    <div class="header-info">
      <div class="hdr-clock" id="hdrClock">--:--</div>
      <div class="hdr-meta">
        <span class="hdr-weather" id="hdrWeather">
          <svg class="hdr-weather-icon" id="hdrWeatherIcon" aria-hidden="true"><use href="#icon-weather-sun"></use></svg>
          <span id="hdrWeatherTemp">--°</span>
        </span>
        <span class="hdr-divider">&bull;</span>
        <span class="hdr-status">
          <span class="hdr-status-dot" id="hdrStatusDot"></span>
          <span id="hdrStatusText">Online</span>
        </span>
      </div>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Secciones">
    <div class="tab-indicator" id="tab-indicator"></div>
    <button class="tab-btn is-active tone-reports" role="tab" id="tab-reports" aria-selected="true" aria-controls="panel-reports" onclick="showTab('reports',this)">
      <svg aria-hidden="true"><use href="#icon-report"></use></svg>Reports
    </button>
    <button class="tab-btn tone-data" role="tab" id="tab-data" aria-selected="false" aria-controls="panel-data" tabindex="-1" onclick="showTab('data',this)">
      <svg aria-hidden="true"><use href="#icon-chart"></use></svg>Data
    </button>
  </div>

  <!-- REPORTS -->
  <div class="panel panel-reports active" id="panel-reports" role="tabpanel" aria-labelledby="tab-reports">
    <div class="btn-list" id="list-reports"></div>
  </div>

  <!-- DATA -->
  <div class="panel panel-data" id="panel-data" role="tabpanel" aria-labelledby="tab-data" hidden>
    <div class="btn-list" id="list-data"></div>
  </div>


</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- In-app view: every linked app opens here, inside this window, never in a new tab -->
<div class="app-view" id="appView" aria-hidden="true">
  <div class="app-view-bar">
    <button type="button" class="app-view-back" id="appViewBack" onclick="closeApp()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      Home
    </button>
    <span class="app-view-title" id="appViewTitle"></span>
  </div>
  <div class="app-view-frame-wrap">
    <iframe id="appViewFrame" title="App content" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="app-view-loading" id="appViewLoading">
      <span class="app-view-spinner" aria-hidden="true"></span>
      <span>Loading…</span>
    </div>
    <div class="app-view-error" id="appViewError">
      <span>This app didn't load inside the dashboard.</span>
      <a id="appViewErrorLink" href="#" target="_blank" rel="noopener noreferrer">Open in browser instead</a>
    </div>
  </div>
</div>

<script>
// Single source of truth for every button. Add/edit/remove entries here —
// the DOM is generated from this array, so no more copy-pasting button markup.
const REPORTS = [
  { href: "https://script.google.com/macros/s/AKfycbzrJq_nQsNucXWAS8_oOSTgZt_F2VQmYQH-QHv-Xau3TSIZOATZqeFZtGZHa51O8UhLjg/exec",

/* In-app view: opens every linked app in an iframe inside this window,
   so the PWA stays a single ecosystem instead of handing off to the browser. */
let appViewOpenTimer = null;

function openApp(url, label){
  const view = document.getElementById('appView');
  const frame = document.getElementById('appViewFrame');
  const title = document.getElementById('appViewTitle');
  const loading = document.getElementById('appViewLoading');
  const errorBox = document.getElementById('appViewError');
  const errorLink = document.getElementById('appViewErrorLink');

  title.textContent = label;
  errorLink.href = url;
  errorBox.classList.remove('show');
  loading.classList.remove('hide');
  frame.src = url;

  view.classList.add('open');
  view.setAttribute('aria-hidden', 'false');

  if (!history.state || history.state.appView !== url) {
    history.pushState({ appView: url }, '', '');
  }

  clearTimeout(appViewOpenTimer);
  appViewOpenTimer = setTimeout(() => {
    loading.classList.add('hide');
    errorBox.classList.add('show');
  }, 9000);
}

function closeApp(fromPopstate){
  const view = document.getElementById('appView');
  const frame = document.getElementById('appViewFrame');
  clearTimeout(appViewOpenTimer);
  view.classList.remove('open');
  view.setAttribute('aria-hidden', 'true');
  setTimeout(() => { frame.src = 'about:blank'; }, 200);

  if (!fromPopstate && history.state && history.state.appView) {
    history.back();
  }
}

document.getElementById('appViewFrame').addEventListener('load', () => {
  clearTimeout(appViewOpenTimer);
  document.getElementById('appViewLoading').classList.add('hide');
});

window.addEventListener('popstate', (e) => {
  if (!e.state || !e.state.appView) closeApp(true);
});

function showTab(tab, btn){
  document.querySelectorAll('.panel').forEach(p=>{p.classList.remove('active'); p.hidden = true;});
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.remove('is-active');
    b.setAttribute('aria-selected','false');
    b.tabIndex = -1;
  });

  const panel = document.getElementById('panel-'+tab);
  panel.classList.add('active');
  panel.hidden = false;

  btn.classList.add('is-active');
  btn.setAttribute('aria-selected','true');
  btn.tabIndex = 0;

  document.getElementById('tab-indicator').classList.toggle('pos-data', tab === 'data');

  document.querySelectorAll('#panel-'+tab+' .neu-btn').forEach(el=>{
    el.style.animation='none'; el.offsetHeight; el.style.animation='';
  });
}

document.querySelector('.tabs').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const tabs = Array.from(document.querySelectorAll('.tab-btn'));
  const currentIndex = tabs.indexOf(document.activeElement);
  if (currentIndex === -1) return;
  e.preventDefault();
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  const nextTab = tabs[(currentIndex + dir + tabs.length) % tabs.length];
  const tabName = nextTab.id === 'tab-reports' ? 'reports' : 'data';
  showTab(tabName, nextTab);
  nextTab.focus();
});

let toastTimer = null;
function doRipple(e, label){
  const btn = e.currentTarget;
  const circle = document.createElement('span');
  const d = btn.clientHeight * 4.5;
  const rect = btn.getBoundingClientRect();
  circle.className = 'ripple';
  circle.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-rect.left-d/2}px;top:${e.clientY-rect.top-d/2}px`;
  btn.appendChild(circle);
  circle.addEventListener('animationend', () => circle.remove());
  showToast('Opening ' + label + '…');
}

function showToast(msg){
  const t = document.getElementById('toast');
  if (toastTimer) clearTimeout(toastTimer);
  t.textContent = msg;
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* Clock */
function updateClock(){
  const now = new Date();
  const h24 = now.getHours();
  const ampm = h24 >= 12 ? 'PM' : 'AM';
  const hh = String(h24 % 12 || 12);
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('hdrClock').innerHTML = `${hh}:${mm}<span class="hdr-clock-ampm">${ampm}</span>`;
}
updateClock();
setInterval(updateClock, 10000);

/* Online / offline status */
function updateOnlineStatus(){
  const online = navigator.onLine;
  document.getElementById('hdrStatusDot').classList.toggle('offline', !online);
  document.getElementById('hdrStatusText').textContent = online ? 'Online' : 'Offline';
}
updateOnlineStatus();
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

/* Weather (Open-Meteo, no API key required) */
function setWeatherIcon(code){
  const use = document.querySelector('#hdrWeatherIcon use');
  const icon = document.getElementById('hdrWeatherIcon');
  let symbol = '#icon-weather-cloud', color = '#CBD5E1';
  if (code === 0) { symbol = '#icon-weather-sun'; color = '#FBBF24'; }
  else if ([1,2,3,45,48].includes(code)) { symbol = '#icon-weather-cloud'; color = '#CBD5E1'; }
  else if ([51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99].includes(code)) { symbol = '#icon-weather-rain'; color = '#60A5FA'; }
  use.setAttribute('href', symbol);
  icon.style.color = color;
}

function loadWeather(lat, lon){
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`)
    .then(r => r.json())
    .then(data => {
      const t = Math.round(data.current.temperature_2m);
      document.getElementById('hdrWeatherTemp').textContent = t + '°F';
      setWeatherIcon(data.current.weather_code);
    })
    .catch(() => { document.getElementById('hdrWeatherTemp').textContent = '--°'; });
}

if (navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    pos => loadWeather(pos.coords.latitude, pos.coords.longitude),
    () => { document.getElementById('hdrWeatherTemp').textContent = '--°'; },
    { timeout: 8000 }
  );
} else {
  document.getElementById('hdrWeatherTemp').textContent = '--°';
}
</script>

<!-- PWA installation / service worker -->
<script>
(function(){
  let deferredInstallPrompt = null;

  // Register the service worker only when this page is served from a real HTTPS origin.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(function(reg){
          console.log('[PWA] Service worker registered:', reg.scope);
          reg.addEventListener('updatefound', function(){
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', function(){
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                showToast('New version available. Refresh to update.');
              }
            });
          });
        })
        .catch(function(err){ console.warn('[PWA] Service worker registration failed:', err); });
    });
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    window.__pwaInstallAvailable = true;
    showToast('Supervisor Dashboard can be installed.');
  });

  window.installSupervisorPWA = async function(){
    if (!deferredInstallPrompt) {
      showToast('Use your browser menu and choose Install app / Add to Home Screen.');
      return false;
    }
    deferredInstallPrompt.prompt();
    const result = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    window.__pwaInstallAvailable = false;
    return result.outcome === 'accepted';
  };

  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null;
    window.__pwaInstallAvailable = false;
    showToast('Supervisor Dashboard installed.');
  });
})();
</script>
